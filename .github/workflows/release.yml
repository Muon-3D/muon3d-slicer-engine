# Manual, draft-only release. All transfers stay on one self-hosted runner; no Actions artifacts.
name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed tag, e.g. v0.5.0
        type: string
        required: true
permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write
concurrency:
  group: engine-release
  cancel-in-progress: false
jobs:
  draft:
    runs-on: ${{ fromJSON(vars.LINUX_RUNS_ON || '["self-hosted","Linux","X64"]') }}
    timeout-minutes: 720
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate immutable release source
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]
          [[ $TAG == "v$version" || $TAG == "v$version"-rc.* ]]
          [[ $(git rev-parse "$TAG^{commit}") == $(git rev-parse HEAD) ]]
          git merge-base --is-ancestor HEAD origin/main
          ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          echo "RELEASE_WORK=$RUNNER_TEMP/engine-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: bash engine/scripts/get-orca.sh
      - uses: ./.github/actions/toolchain
        with:
          variant: st
      - name: Build and test st (clean build tree)
        shell: bash
        run: |
          set -euo pipefail
          ENGINE_BUILD="$RELEASE_WORK/build-st" ENGINE_DIST="$RELEASE_WORK/st" bash engine/scripts/build.sh st
          ENGINE_DIR="$RELEASE_WORK/st" npm run test:engine -- st
          g++ -std=c++17 -O2 -Wall -Wextra -Werror engine/tests/cantilever_compliance.cpp -o "$RELEASE_WORK/compliance"
          "$RELEASE_WORK/compliance"
      - name: Corresponding sources and notices
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libarchive-tools
          bash engine/deps/fetch-deps.sh
          ENGINE_DIST="$RELEASE_WORK/host" HOST_METAFILE="$RELEASE_WORK/host-meta.json" node host/build.mjs
          HOST_METAFILE="$RELEASE_WORK/host-meta.json" node tools/release/third-party-notices.mjs --check
          HOST_METAFILE="$RELEASE_WORK/host-meta.json" bash tools/release/source-bundles.sh "$RELEASE_WORK/sources" "${TAG#v}"
      - uses: ./.github/actions/toolchain
        with:
          variant: mt
      - name: Build and test mt (clean build tree)
        shell: bash
        run: |
          set -euo pipefail
          ENGINE_BUILD="$RELEASE_WORK/build-mt" ENGINE_DIST="$RELEASE_WORK/mt" bash engine/scripts/build.sh mt
          ENGINE_DIR="$RELEASE_WORK/mt" npm run test:engine -- mt
      - name: Assemble and create draft
        run: bash tools/release/prepare-self-hosted.sh
      - name: Host and protocol tests on the combined runtime
        run: npm test -- --test-concurrency=1
      - name: Verify downloads and offline rebuilds; retain draft
        run: bash tools/release/verify-self-hosted.sh
      - uses: actions/attest@v4
        with:
          subject-checksums: assets/SHA256SUMS
